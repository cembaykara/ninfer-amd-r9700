name: ninfer-r9700

services:
  server:
    image: local/ninfer-r9700:compose
    build:
      context: .
      target: runtime
      args:
        NINFER_BUILD_JOBS: ${NINFER_BUILD_JOBS:-8}
      additional_contexts:
        rocm: ${NINFER_ROCM_CONTEXT:-/opt/rocm/core-10.0}
        python311: ${NINFER_PYTHON_CONTEXT:?Set the self-contained Python 3.11 root in .env}
    devices:
      - /dev/kfd:/dev/kfd
      - ${NINFER_DRM_RENDER_NODE:-/dev/dri/renderD128}:${NINFER_DRM_RENDER_NODE:-/dev/dri/renderD128}
    ports:
      - "${NINFER_BIND_ADDRESS:-127.0.0.1}:${NINFER_PORT:-8001}:8080"
      # NINFER_DIT_PACK_DUMP: /logs/dit_pack.bin
      # NINFER_DIT_EMB_DUMP: /logs/dit_emb.bin
      # NINFER_DIT_PRE0_DUMP: /logs/dit_pre0.bin
      # NINFER_DIT_TXT_DUMP: /logs/dit_txt.bin
      # NINFER_DIT_TARGET_DUMP: /logs/dit_target.bin
      # NINFER_DIT_QN_DUMP: /logs/dit_qn.bin
      # NINFER_DIT_LAYER_DUMP: /logs/dit_layer
    volumes:
      # Diagnostic dumps (NINFER_DIT_*).
      - type: bind
        source: /home/tengri/mergen-api/logs
        target: /logs
        bind:
          create_host_path: true
      - type: bind
        source: ${NINFER_MODELS_DIR:-../models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      # Image-gen support (single-compose): the generate script swaps encoder ->
      # DiT -> VAE in this same container, so it needs the LoRA dir and the
      # Qwen3-VL tokenizer (the encoder reads it from this absolute host path).
      - type: bind
        source: /home/tengri/mergen-api/models/loras
        target: /loras
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/tengri/mergen-api/models/hf
        target: /home/tengri/mergen-api/models/hf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NINFER_DISK_CACHE_DIR:-/ssdpool2nvme/local_llm/cache_r9700}
        target: /cache
        bind:
          create_host_path: false
    shm_size: 1gb
    mem_limit: 25769803776
    memswap_limit: 30g
    ulimits:
      memlock: {soft: -1, hard: -1}
    init: true
    restart: unless-stopped
    stop_grace_period: 2m
    command: >
      ninfer-serve
      /models/${NINFER_MODEL:-qwen3.8-27b-r9700-fp8lut4/qwen3.8-27b-r9700-fp8lut4.ninfer}
      --host 0.0.0.0 --port 8080
      --temperature 1.5
      --max-context ${NINFER_MAX_CONTEXT:-32768}
      --max-concurrency ${NINFER_CONCURRENCY:-1}
      --prefill-chunk 2048
      --kv-capacity auto
      --kv-ram-capacity ${NINFER_RAM_CACHE_MIB:-off}
      --kv-disk-capacity ${NINFER_DISK_CACHE_MIB:-off}
      --kv-disk-location /cache
      --model-id ${SERVED_MODEL_NAME:-qwen3.8-27b-ninfer}
      --pending-timeout-ms 900000
      --default-max-tokens 32768
      ${NINFER_EXTRA_FLAGS:-}

    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      start_period: 3m
      retries: 4
